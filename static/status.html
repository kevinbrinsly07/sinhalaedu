<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>API Status</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;padding:2rem}
    pre{background:#f6f8fa;padding:1rem;border-radius:6px}
  </style>
</head>
<body>
  <h1>Sinhala Exam Paper Generator — Status</h1>
  <p>Fetching API root JSON from <code>/</code></p>
  <pre id="json">Loading...</pre>
  <script>
    async function loadStatus(){
      try{
        const res = await fetch('/');
        const j = await res.json();
        document.getElementById('json').textContent = JSON.stringify(j, null, 2);
      }catch(e){
        document.getElementById('json').textContent = 'Error: '+e;
      }
    }
    loadStatus();
  </script>
</body>
</html>
